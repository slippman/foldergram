<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Foldergram" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Foldergram</title>
    <script>
      if (/^\/(share|f|folders)\//.test(window.location.pathname)) document.documentElement.classList.add('album-entry');
    </script>
    <style>
      :root { --ur-logo-filter: none; --ur-logo-blend: multiply; }
      :root[data-theme="dark"] { --ur-logo-filter: invert(1) contrast(1.05); --ur-logo-blend: screen; }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) { --ur-logo-filter: invert(1) contrast(1.05); --ur-logo-blend: screen; }
        :root:not([data-theme="light"]).shared-album-entry #fg-splash { background: #0c1014; color: #8a96a9; }
      }
      /* ── Splash screen — shown before Vue boots ──────────────────── */
      #fg-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: #0a0e18;
        z-index: 99999;
        transition: opacity 0.3s ease, visibility 0.3s ease;
      }
      #fg-splash.fg-splash--out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .fg-splash__ring {
        position: absolute;
        width: 110px;
        height: 110px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(99,102,241,0.22) 0%, rgba(139,92,246,0.08) 55%, transparent 72%);
        animation: fg-splash-pulse 1.8s ease-in-out infinite;
      }
      .fg-splash__logo {
        position: relative;
        width: 58px;
        height: 58px;
        filter: drop-shadow(0 0 20px rgba(139,92,246,0.6));
        animation: fg-splash-pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }

      .fg-splash__album { display: none; }
      .shared-album-entry #fg-splash { background: var(--bg, #fafafa); color: var(--muted, #666); }
      .shared-album-entry .fg-splash__ring, .shared-album-entry .fg-splash__logo { display: none; }
      .shared-album-entry .fg-splash__album { display: flex; flex-direction: column; align-items: center; gap: 1rem; font: 0.95rem Inter, sans-serif; }
      .fg-splash__album img { mix-blend-mode: var(--ur-logo-blend, multiply); filter: var(--ur-logo-filter, none); width: 144px; height: 144px; object-fit: contain; background: white; border-radius: 1rem; }
      .fg-splash__album p { margin: 0; }
      .fg-splash__indicator { width: 5rem; height: 3px; border-radius: 2px; background: var(--border, #ddd); overflow: hidden; }
      .fg-splash__indicator::after { content: ''; display: block; width: 40%; height: 100%; background: var(--muted, #666); border-radius: inherit; animation: fg-album-loading 1.4s ease-in-out infinite alternate; }
      .fg-splash__retry { padding: 0.55rem 1rem; border: 1px solid currentColor; border-radius: 0.6rem; color: inherit; background: transparent; font: inherit; cursor: pointer; }
      .fg-splash__retry[hidden] { display: none; }
      @keyframes fg-album-loading { from { transform: translateX(0); } to { transform: translateX(150%); } }
      @media (prefers-reduced-motion: reduce) { .fg-splash__indicator::after { animation: none; width: 100%; opacity: 0.5; } }
      @keyframes fg-splash-pop {
        from { opacity: 0; transform: scale(0.72); }
        to   { opacity: 1; transform: scale(1); }
      }
      @keyframes fg-splash-pulse {
        0%, 100% { transform: scale(1);    opacity: 0.7; }
        50%       { transform: scale(1.6); opacity: 0.15; }
      }
    </style>
  </head>
  <body>
    <!-- Branded splash: visible immediately, removed once Vue mounts -->
    <div id="fg-splash" role="status" aria-live="polite">
      <div class="fg-splash__album">
        <img src="/branding/ur-logo-4e4dc1180945.png" width="144" height="144" alt="UR" />
        <p>Loading album…</p>
        <span class="fg-splash__indicator" aria-hidden="true"></span>
        <button class="fg-splash__retry" type="button" hidden onclick="window.location.reload()">Retry loading album</button>
      </div>
      <div class="fg-splash__ring"></div>
      <svg class="fg-splash__logo" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="fgSplashGrad" x1="2" y1="2" x2="18" y2="18" gradientUnits="userSpaceOnUse">
            <stop offset="0%"   stop-color="#6366F1" />
            <stop offset="50%"  stop-color="#8B5CF6" />
            <stop offset="100%" stop-color="#EC4899" />
          </linearGradient>
        </defs>
        <path
          d="M2 4.5A2.5 2.5 0 0 1 4.5 2h11A2.5 2.5 0 0 1 18 4.5v11a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 2 15.5v-11zM4.5 3A1.5 1.5 0 0 0 3 4.5v11A1.5 1.5 0 0 0 4.5 17h11a1.5 1.5 0 0 0 1.5-1.5v-11A1.5 1.5 0 0 0 15.5 3h-11zM5 6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6zm3 0H6v2h2V6zm-3 6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-2zm3 0H6v2h2v-2zm3-6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1V6zm3 0h-2v2h2V6zm-3 6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1v-2zm3 0h-2v2h2v-2z"
          fill="url(#fgSplashGrad)"
        />
      </svg>

    </div>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // Album routes explicitly signal readiness; mounting an intermediate shell is insufficient.
      (function () {
        var initialSplash = document.getElementById('fg-splash');
        if (!initialSplash) return;
        var splashTemplate = initialSplash.cloneNode(true);
        var stopCurrentRun = null;
        var generation = 0;
        function run() {
          var splash = document.getElementById('fg-splash');
          var app = document.getElementById('app');
          if (!splash || !app) return;
          var albumEntry = document.documentElement.classList.contains('album-entry');
          var finishing = false;
          var cancelled = false;
          stopCurrentRun = function () {
            cancelled = true;
            clearTimeout(startupDeadline);
            observer.disconnect();
            splash.remove();
          };
          function showRetry(message) {
            var text = splash.querySelector('.fg-splash__album p');
            var retry = splash.querySelector('.fg-splash__retry');
            var indicator = splash.querySelector('.fg-splash__indicator');
            if (text) text.textContent = message;
            if (retry) retry.hidden = false;
            if (indicator) indicator.hidden = true;
          }
          var startupDeadline = setTimeout(function () {
            showRetry('This album is taking longer to load. Please try again.');
          }, 20000);
          function getImages(element) {
            return Array.from(element.querySelectorAll('img')).filter(function (img) {
              return !img.hasAttribute('data-album-resilient') && (img.getAttribute('src') || img.getAttribute('srcset'));
            });
          }
          function waitForComponent(marker) {
            return new Promise(function (resolve, reject) {
              var poll;
              function check() {
                if (cancelled || !marker.isConnected || marker.dataset.albumImageState === 'ready') { clearInterval(poll); resolve(); }
                else if (marker.dataset.albumImageState === 'error') { clearInterval(poll); reject(new Error('Image unavailable')); }
              }
              poll = setInterval(check, 100);
              check();
            });
          }
          function waitForImage(img) {
            return new Promise(function (resolve, reject) {
              var poll;
              var wasConnected = img.isConnected;
              function cleanup() {
                clearInterval(poll);
                img.removeEventListener('load', loaded);
                img.removeEventListener('error', failed);
              }
              function loaded() {
                cleanup();
                if (img.naturalWidth) resolve();
                else reject(new Error('Image unavailable'));
              }
              function failed() { cleanup(); reject(new Error('Image unavailable')); }
              function check() {
                if (cancelled) { cleanup(); resolve(); return; }
                if (wasConnected && !img.isConnected) { cleanup(); resolve(); return; }
                if (img.complete) loaded();
              }
              // Observe before releasing lazy loading; cached reloads may omit a fresh event.
              img.addEventListener('load', loaded);
              img.addEventListener('error', failed);
              poll = setInterval(check, 100);
              img.loading = 'eager';
              check();
            });
          }
          function finish() {
            if (cancelled || finishing) return;
            var state = app.querySelector('[data-album-state]');
            if (!app.childElementCount || (albumEntry && !state)) return;
            if (albumEntry) {
              var theme = state.dataset.albumTheme || 'cinema';
              if (theme === 'unknown' && state.dataset.albumState !== 'settled') return;
              albumEntry = theme === 'cinema';
              document.documentElement.classList.toggle('shared-album-entry', albumEntry);
            }
            if (albumEntry && state.dataset.albumState === 'loading') return;
            finishing = true;
            requestAnimationFrame(function () {
              var images = albumEntry && state.dataset.albumState === 'ready'
                ? getImages(state) : [];
              var posters = albumEntry && state.dataset.albumState === 'ready'
                ? Array.from(state.querySelectorAll('[data-album-poster]')).map(function (post) {
                    var img = new Image(); img.src = post.dataset.albumPoster; return img;
                  }) : [];
              var components = albumEntry && state.dataset.albumState === 'ready'
                ? Array.from(state.querySelectorAll('[data-album-image-state]')) : [];
              Promise.all(images.concat(posters).map(waitForImage).concat(components.map(waitForComponent))).then(function () {
                if (cancelled) return;
                var current = app.querySelector('[data-album-state]');
                if (albumEntry && (!current || current.dataset.albumState === 'loading')) { finishing = false; finish(); return; }
                // Pagination may have appended a batch while readiness was being checked.
                if (albumEntry && current.dataset.albumState === 'ready' && (getImages(current).some(function (img) { return !img.complete || !img.naturalWidth; })
                  || Array.from(current.querySelectorAll('[data-album-image-state]')).some(function (marker) { return marker.dataset.albumImageState !== 'ready'; }))) {
                  finishing = false; finish(); return;
                }
                clearTimeout(startupDeadline);
                observer.disconnect();
                splash.classList.add('fg-splash--out');
                setTimeout(function () {
                  if (cancelled) return;
                  stopCurrentRun = null;
                  splash.remove();
                  window.dispatchEvent(new Event('foldergram:album-ready'));
                }, 340);
              }).catch(function () {
                if (cancelled) return;
                clearTimeout(startupDeadline);
                showRetry('Some images could not load. Please try again.');
              });
            });
          }
          function changed() {
            var state = app.querySelector('[data-album-state]');
            if (albumEntry && state && (!state.dataset.albumTheme || state.dataset.albumTheme === 'cinema')) app.querySelectorAll('img').forEach(function (img) { img.loading = 'eager'; });
            finish();
          }
          var observer = new MutationObserver(changed);
          observer.observe(app, { childList: true, subtree: true, attributes: true, attributeFilter: ['data-album-state', 'data-album-theme'] });
          changed();
        }
        window.addEventListener('foldergram:album-view-cancel', function () {
          generation++;
          var splash = document.getElementById('fg-splash');
          if (stopCurrentRun) stopCurrentRun();
          stopCurrentRun = null;
          if (splash) splash.remove();
          document.documentElement.classList.remove('shared-album-entry');
          document.documentElement.classList.remove('album-entry');
          if (splash) window.dispatchEvent(new Event('foldergram:album-ready'));
        });
        window.addEventListener('foldergram:album-view-loading', function () {
          var nextGeneration = ++generation;
          if (stopCurrentRun) stopCurrentRun();
          stopCurrentRun = null;
          var splash = document.getElementById('fg-splash');
          if (splash) splash.remove();
          document.documentElement.classList.add('album-entry');
          document.body.appendChild(splashTemplate.cloneNode(true));
          requestAnimationFrame(function () { if (generation === nextGeneration) run(); });
        });
        run();
      })();
    </script>
  </body>
</html>
